<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원본 그대로 검증</title>
<style>
  body { margin: 0; background: #918f94; font-family: sans-serif; }
  .wrap { max-width: 375px; margin: 0 auto; }
  h3 { color: #fff; font-size: 14px; margin: 14px 8px 6px; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); }
  .g2 { display: grid; grid-template-columns: repeat(2, 1fr); }
  .g3 img, .g2 img { width: 100%; display: block; }
</style>
<div class="wrap">
  <h3>① 게임 크기 (3열) — 색은 원본 100% 그대로, 다만 작아서 질감 덜 보임</h3>
  <div class="g3">
    <img src="./assets/ducks/raw/face-tori.png">
    <img src="./assets/ducks/raw/face-sori.png">
    <img src="./assets/ducks/raw/face-mari.png">
    <img src="./assets/ducks/raw/face-nuri.png">
    <img src="./assets/ducks/raw/face-bori.png">
    <img src="./assets/ducks/raw/face-yuri.png">
    <img src="./assets/ducks/raw/face-nari.png">
    <img src="./assets/ducks/raw/face-duri.png">
    <img src="./assets/ducks/raw/face-ari.png">
    <img src="./assets/ducks/raw/face-miri.png">
  </div>
  <h3>② 크게 (2열) — 질감이 원본처럼 살아남</h3>
  <div class="g2">
    <img src="./assets/ducks/raw/face-tori.png">
    <img src="./assets/ducks/raw/face-bori.png">
    <img src="./assets/ducks/raw/face-duri.png">
    <img src="./assets/ducks/raw/face-ari.png">
  </div>
</div>
